<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
  <style>
    body{margin:0;font-family:"Patrick Hand","Comic Sans MS",cursive;color:#2A2A2A}
    a{color:#2A2A2A} a:hover{color:#000}
    .box{border:1.5px dashed #6A6A6A;border-radius:6px}
    .fill{background:#2B2F3A;border-radius:6px}
    .txt{height:8px;border-radius:4px;background:#8A8F9C}
  </style>
</helmet>
<div style="width:720px;height:520px;background:#F4F4F1;padding:24px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box">
  <div style="display:flex;align-items:baseline;gap:12px">
    <span style="font-size:26px">Alternate B: Nightfall</span>
    <span style="font-size:16px;color:#6A6A6A">keep dark, add glow and air, cut the mono</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;gap:12px;padding:16px;background:#1A1D26;border-radius:10px;position:relative;overflow:hidden">
    <div style="position:absolute;left:-60px;top:-80px;width:360px;height:260px;border-radius:50%;background:radial-gradient(closest-side,rgba(95,201,138,.35),transparent)"></div>
    <div style="position:absolute;right:-40px;bottom:-60px;width:300px;height:220px;border-radius:50%;background:radial-gradient(closest-side,rgba(169,151,230,.3),transparent)"></div>
    <div style="position:relative;display:flex;align-items:center;gap:10px"><span style="width:18px;height:18px;border-radius:50%;border:2px solid #5FC98A"></span><span style="color:#F1EDE3;font-size:18px">Polyvise</span><span style="margin-left:auto;display:flex;gap:8px"><span class="txt" style="width:40px"></span><span class="txt" style="width:40px"></span><span class="txt" style="width:40px"></span></span></div>
    <div style="position:relative;display:flex;flex-direction:column;gap:8px;margin-top:20px;align-items:center">
      <div class="txt" style="width:380px;height:22px;background:#E8E4DA"></div>
      <div class="txt" style="width:260px;height:22px;background:#E8E4DA"></div>
      <div class="txt" style="width:300px;height:8px;margin-top:6px"></div>
    </div>
    <div style="position:relative;margin:18px auto 0;width:480px;border:1.5px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(255,255,255,.04);padding:14px;display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(8px)">
      <div class="txt" style="width:300px;height:14px;background:#5A5F6C"></div>
      <div style="display:flex;gap:8px"><div style="flex:1;height:40px;border-radius:8px;border:1.5px solid #5FC98A;background:rgba(95,201,138,.12)"></div><div style="flex:1;height:40px;border-radius:8px;border:1.5px solid rgba(255,255,255,.14)"></div><div style="flex:1;height:40px;border-radius:8px;border:1.5px solid rgba(255,255,255,.14)"></div></div>
      <div style="display:flex;align-items:center;gap:8px"><div class="txt" style="width:120px"></div><div style="margin-left:auto;width:120px;height:34px;border-radius:999px;background:#5FC98A;box-shadow:0 0 24px rgba(95,201,138,.5)"></div></div>
    </div>
  </div>
  <p style="font-size:16px;line-height:1.35;color:#4A4A4A">Least change from today. Wins the "cool" brief with glow and blur, but dark-only stays a barrier for the first-time visitor and the console feel only fades if the mono caps go too.</p>
</div>
</x-dc>
</body>
</html>
